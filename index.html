<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>活动发放记录 · 补发原因 · 需求说明</title>
  <style>
    :root {
      --bg: #f3f5f7; --card: #fff; --ink: #1f1f1f; --sub: #595959; --line: #e6e8eb;
      --new: #cf1322;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 14px; line-height: 1.6; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { margin: 0; font-size: 26px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .lead { margin: 8px 0 0; color: var(--sub); }
    .card { background: var(--card); border-radius: 12px; padding: 18px; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #fafafa; color: var(--sub); font-weight: 550; }
    .mark { display: inline-block; min-width: 36px; text-align: center; border-radius: 4px; font-size: 12px; padding: 0 6px; line-height: 20px; }
    .mark.add { background: #fff1f0; color: var(--new); }
    .mark.keep { background: #f5f5f5; color: #595959; }
    .foot { margin: 8px 0 0; color: var(--sub); font-size: 12px; }
    figure { margin: 14px 0 0; }
    figure img { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 8px; }
    figcaption { margin-top: 6px; color: var(--sub); font-size: 12px; }
    ul { margin: 8px 0 0; padding-left: 18px; }
    li { margin: 4px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>活动发放记录 · 补发原因</h1>
    <p class="lead">营销中心 → 活动发放记录。重新发放时，补发原因由必填改为非必填。弹窗里的其他项不变。</p>

    <section class="card">
      <h2>1. 现在</h2>
      <p>在活动发放记录里对一条记录做重新发放，弹出「重新发送」。补发原因带星号。字数上限 120。</p>
      <figure>
        <img src="assets/reissue-reason/01-reissue-dialog.png" alt="活动发放记录中重新发送弹窗，补发原因当前为必填" />
        <figcaption>红框是补发原因。现在标题前有星号，右下角 0/120。</figcaption>
      </figure>
    </section>

    <section class="card">
      <h2>2. 这次改什么</h2>
      <table>
        <thead><tr><th>项</th><th>现在</th><th>改为</th></tr></thead>
        <tbody>
          <tr>
            <td>补发原因</td>
            <td>必填</td>
            <td><span class="mark add">非必填</span> 去掉星号。空着可以保存</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
</body>
</html>
